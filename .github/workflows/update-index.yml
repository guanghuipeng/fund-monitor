name: Update index star page

on:
  schedule:
    # GitHub Actions 用 UTC，北京时间 = UTC+8，周一到周五
    # 11:35 午盘（03:35 UTC）：看上午行情，下午可操作
    - cron: "35 3 * * 1-5"
    # 15:05 收盘（07:05 UTC）：收盘后立刻看当日结果
    - cron: "5 7 * * 1-5"
    # 21:35 晚间（13:35 UTC）：官方估值数据更新后复核
    - cron: "35 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-index
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # 缓存估值历史，避免每次从零下载；仓库里也有一份基线缓存兜底
      - name: Restore valuation cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: index-cache-${{ github.run_id }}
          restore-keys: |
            index-cache-

      - name: Rebuild star page
        env:
          PYTHONIOENCODING: utf-8
        run: python index_watch.py --refresh --html docs/index.html

      # 只有出现新的买/卖档位才推送；重复的档位不会每天刷屏。
      # 没配 Secret 时这一步会直接跳过，不影响页面更新。
      - name: Push actionable signal
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python index_watch.py --push --signal-only

      - name: Commit and push
        env:
          PYTHONIOENCODING: utf-8
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          [ -f data/alert_state.json ] && git add data/alert_state.json || true
          if git diff --cached --quiet; then
            echo "页面没有变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: update index star page $(date -u +%F)"
          git push
